[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
twilight-util = { version = "0.18", features = ["builder"] }
twilight-cache-inmemory = "0.17"
tommybot-core = { path = "crates/core" }
tommybot-antinuke = { path = "crates/antinuke" }
tommybot-automod = { path = "crates/automod" }
tommybot-logging = { path = "crates/logging" }

# twilight-model 0.18.0 with one change: Permissions deserializes with from_bits_retain, so roles and
# overwrites read from Discord keep bits twilight does not know (1<<48 Set Voice Channel Status).
# Re-apply the patch (src/guild/permissions.rs, visit_u64) on every twilight upgrade.
[patch.crates-io]
twilight-model = { path = "vendor/twilight-model" }

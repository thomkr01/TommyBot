[package]
name = "tommybot"
version = "0.1.0"
edition.workspace = true

[dependencies]
tommybot-core.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
twilight-gateway.workspace = true
twilight-http.workspace = true
twilight-model.workspace = true
twilight-util.workspace = true
serde_json.workspace = true
sqlx.workspace = true
serde.workspace = true
tommybot-antinuke.workspace = true
tommybot-automod.workspace = true
tommybot-logging.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
captcha = "1"
rand = "0.10"
base64 = "0.23"
# captcha still pulls in image 0.24 for its own drawing; we only exchange PNG bytes with it.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rqrr = { version = "0.11.0", default-features = false }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

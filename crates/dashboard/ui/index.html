<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TommyBot Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link data-trunk rel="css" href="style.css" />
</head>
<body>
  <script>
    // A blank page hides failures: show load errors on the page itself.
    function showError(msg) {
      var d = document.createElement('pre');
      d.style.cssText = 'padding:16px;color:#c92a2a;white-space:pre-wrap';
      d.textContent = 'Dashboard failed to start: ' + msg;
      document.body.appendChild(d);
    }
    window.addEventListener('error', function (e) { showError(e.message || String(e.error)); });
    window.addEventListener('unhandledrejection', function (e) { showError(String(e.reason)); });
  </script>
</body>
</html>

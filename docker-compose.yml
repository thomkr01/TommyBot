name: tommybot

# Cap container logs so they cannot fill the disk.
x-logging: &logging
  logging:
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: tommybot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tommybot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tommybot -d tommybot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    image: ghcr.io/thomkr01/tommybot-bot:${TOMMYBOT_TAG:-latest}
    build:
      context: .
      target: bot
    restart: unless-stopped
    <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DATABASE_URL: postgres://tommybot:${POSTGRES_PASSWORD}@postgres:5432/tommybot
      RUST_LOG: ${RUST_LOG:-info}
      # Also log to files here, read by the MCP server.
      LOG_DIR: /logs
      # Lets the MCP server's read-only database role log in (migration 2700).
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-}
      # Links in the welcome message.
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
    volumes:
      - logs:/logs

  dashboard:
    image: ghcr.io/thomkr01/tommybot-dashboard:${TOMMYBOT_TAG:-latest}
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Localhost only: Docker's port rules bypass ufw. Reach it from outside via the tunnel or a proxy.
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://tommybot:${POSTGRES_PASSWORD}@postgres:5432/tommybot
      DASHBOARD_URL: ${DASHBOARD_URL:?set DASHBOARD_URL in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_DIR: /logs
    volumes:
      - logs:/logs

  # Runs updates started from the dashboard (bot owner only). It alone holds the Docker socket, has no
  # open port, and only ever pulls this project's images and recreates bot and dashboard.
  updater:
    image: ghcr.io/thomkr01/tommybot-updater:${TOMMYBOT_TAG:-latest}
    build:
      context: .
      target: updater
    restart: unless-stopped
    <<: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tommybot:${POSTGRES_PASSWORD}@postgres:5432/tommybot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The compose file and .env, so it recreates the containers exactly as configured.
      - .:/project:ro

  # Read-only MCP server for Claude (status, logs, config, cases). Off unless COMPOSE_PROFILES includes
  # mcp; see DEPLOY.md. No Discord token and no Docker socket: it reads views as tommybot_mcp and the log files.
  mcp:
    image: ghcr.io/thomkr01/tommybot-mcp:${TOMMYBOT_TAG:-latest}
    build:
      context: .
      target: mcp
    profiles: [mcp]
    restart: unless-stopped
    <<: *logging
    depends_on:
      # The bot runs the migration and sets the role's password.
      bot:
        condition: service_started
    environment:
      MCP_TOKEN: ${MCP_TOKEN:-}
      # Login for claude.ai through Discord (the dashboard's app); off until all are set. See DEPLOY.md.
      MCP_OAUTH_SECRET: ${MCP_OAUTH_SECRET:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_OWNER_ID: ${MCP_OWNER_ID:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      MCP_DATABASE_URL: postgres://tommybot_mcp:${MCP_DB_PASSWORD:-}@postgres:5432/tommybot
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - logs:/logs:ro

  # Cloudflare Tunnel to the dashboard. Off unless COMPOSE_PROFILES=tunnel; see DEPLOY.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    <<: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
  logs:
